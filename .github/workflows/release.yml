name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Gate the release on the full test suite: engine, desktop, cli (if present),
  # frontend, and the web build must all be green before any signing happens.
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - run: bun install --frozen-lockfile
      - name: Build desktop frontend (main.go embeds frontend/dist)
        run: cd apps/desktop/frontend && bun run build
      - name: Test packages/engine
        run: cd packages/engine && go test ./... -race -cover
      - name: Test apps/desktop
        run: cd apps/desktop && go test ./... -race -cover
      - name: Test apps/cli
        if: hashFiles('apps/cli/go.mod') != ''
        run: cd apps/cli && go test ./... -race -cover
      - name: Frontend vitest
        run: cd apps/desktop/frontend && bun run test
      - name: Web build
        run: cd apps/web && bun run build

  build-release:
    needs: test
    runs-on: macos-latest
    env:
      # secrets are not readable in step-level `if:`; surface presence here.
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
    # Consumed by bump-homebrew-tap. cli_sha256 stays empty when no CLI
    # tarball was built, which is how that job knows to leave the formula alone.
    outputs:
      version: ${{ steps.checksums.outputs.version }}
      dmg_sha256: ${{ steps.checksums.outputs.dmg_sha256 }}
      cli_sha256: ${{ steps.checksums.outputs.cli_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - name: Install Wails CLI
        # Pinned to match the wails/v2 library version in apps/desktop/go.mod
        # (reproducible builds; avoids a silent CLI/library drift).
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - run: bun install --frozen-lockfile
      - name: Build desktop app (universal binary)
        # -ldflags stamps main.appVersion so the in-app update check compares
        # against a real version instead of "dev".
        run: |
          cd apps/desktop
          wails build -platform darwin/universal -ldflags "-X main.appVersion=${GITHUB_REF_NAME#v}"
      # Signing/notarization steps are skipped when the signing secrets are
      # absent (e.g. forks), so unsigned releases still build.
      - name: Import signing certificate
        if: env.HAS_MACOS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"
          # fail here, not at codesign, if the p12 lacks a Developer ID identity.
          security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application"
      - name: Sign app
        if: env.HAS_MACOS_SIGNING == 'true'
        run: |
          codesign --force --deep --options runtime --timestamp \
            --sign "Developer ID Application" "apps/desktop/build/bin/App Cleaner.app"
          codesign --verify --deep --strict --verbose=2 "apps/desktop/build/bin/App Cleaner.app"
      - name: Package artifact (.dmg)
        run: |
          cd apps/desktop
          npx --yes appdmg build/darwin/dmg/appdmg.json \
            "build/bin/app-cleaner_${GITHUB_REF_NAME#v}_darwin_universal.dmg"
      - name: Sign, notarize, and staple dmg
        if: env.HAS_MACOS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG=(apps/desktop/build/bin/*.dmg)
          codesign --force --timestamp --sign "Developer ID Application" "${DMG[0]}"
          xcrun notarytool submit "${DMG[0]}" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          # staple fails if notarization did not fully succeed, failing the job.
          xcrun stapler staple "${DMG[0]}"
          xcrun stapler validate "${DMG[0]}"
      # Guarded so a tag cut before Plan 2 lands still releases the GUI alone;
      # softprops/action-gh-release does not fail on an unmatched glob by
      # default (fail_on_unmatched_files is false), so no CLI tarball simply
      # means the release ships with the .dmg only.
      - name: Build CLI (universal binary)
        if: hashFiles('apps/cli/go.mod') != ''
        run: |
          cd apps/cli
          VERSION="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o bin/app-cleaner-amd64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.version=${VERSION}" -o bin/app-cleaner-arm64 .
          lipo -create -output bin/app-cleaner bin/app-cleaner-amd64 bin/app-cleaner-arm64
          rm bin/app-cleaner-amd64 bin/app-cleaner-arm64
      - name: Sign CLI binary
        if: hashFiles('apps/cli/go.mod') != '' && env.HAS_MACOS_SIGNING == 'true'
        run: codesign --force --options runtime --timestamp --sign "Developer ID Application" apps/cli/bin/app-cleaner
      - name: Package CLI tarball
        if: hashFiles('apps/cli/go.mod') != ''
        run: |
          cd apps/cli/bin
          tar -czf "app-cleaner-cli_${GITHUB_REF_NAME#v}_darwin_universal.tar.gz" app-cleaner
      - name: Checksum release assets (for the Homebrew tap bump)
        id: checksums
        run: |
          CLI_SHA256=""
          if compgen -G "apps/cli/bin/*.tar.gz" > /dev/null; then
            CLI_SHA256="$(shasum -a 256 apps/cli/bin/*.tar.gz | awk '{print $1}')"
          fi
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "dmg_sha256=$(shasum -a 256 apps/desktop/build/bin/*.dmg | awk '{print $1}')"
            echo "cli_sha256=$CLI_SHA256"
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/build/bin/*.dmg
            apps/cli/bin/*.tar.gz

  # Point the Homebrew tap (GuilhermeVozniak/homebrew-tap) at the assets that
  # were just published so `brew install --cask GuilhermeVozniak/tap/app-cleaner`
  # and `brew install GuilhermeVozniak/tap/app-cleaner-cli` resolve to the new
  # version. Pushing to the tap needs HOMEBREW_TAP_TOKEN (README, "Release
  # flow"); without it the tap files are still audited but the push is skipped
  # with a warning.
  bump-homebrew-tap:
    name: Bump Homebrew tap
    needs: build-release
    if: needs.build-release.outputs.dmg_sha256 != ''
    runs-on: macos-latest
    env:
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      TAP: guilhermevozniak/tap
      VERSION: ${{ needs.build-release.outputs.version }}
      DMG_SHA256: ${{ needs.build-release.outputs.dmg_sha256 }}
      CLI_SHA256: ${{ needs.build-release.outputs.cli_sha256 }}
    steps:
      - name: Tap guilhermevozniak/tap
        run: brew tap "$TAP"

      - name: Rewrite version and sha256 in Casks/app-cleaner.rb
        run: |
          CASK="$(brew --repository "$TAP")/Casks/app-cleaner.rb"
          sed -i '' -E "s|^  version \".*\"$|  version \"$VERSION\"|" "$CASK"
          sed -i '' -E "s|^  sha256 \".*\"$|  sha256 \"$DMG_SHA256\"|" "$CASK"
          grep -q "^  version \"$VERSION\"" "$CASK"
          grep -q "^  sha256 \"$DMG_SHA256\"" "$CASK"

      - name: Rewrite url and sha256 in Formula/app-cleaner-cli.rb
        if: env.CLI_SHA256 != ''
        run: |
          FORMULA="$(brew --repository "$TAP")/Formula/app-cleaner-cli.rb"
          sed -i '' -E "s|/download/v[0-9.]+/app-cleaner-cli_[0-9.]+_|/download/v${VERSION}/app-cleaner-cli_${VERSION}_|" "$FORMULA"
          sed -i '' -E "s|^  sha256 \".*\"$|  sha256 \"$CLI_SHA256\"|" "$FORMULA"
          grep -q "/download/v${VERSION}/app-cleaner-cli_${VERSION}_darwin_universal.tar.gz" "$FORMULA"
          grep -q "^  sha256 \"$CLI_SHA256\"" "$FORMULA"

      - name: Show tap diff
        run: git -C "$(brew --repository "$TAP")" --no-pager diff

      # `brew fetch` downloads each asset from the release and verifies its
      # sha256, so a wrong asset name or checksum fails here, not on users.
      - name: Audit and fetch the updated cask and formula
        run: |
          brew audit --cask "$TAP/app-cleaner"
          brew fetch --cask "$TAP/app-cleaner"
          if [ -n "$CLI_SHA256" ]; then
            brew audit --formula "$TAP/app-cleaner-cli"
            brew fetch --formula "$TAP/app-cleaner-cli"
          fi

      - name: Push to the tap
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          cd "$(brew --repository "$TAP")"
          if git diff --quiet; then echo "tap already at $VERSION; nothing to push"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "app-cleaner $VERSION"
          git push "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/GuilhermeVozniak/homebrew-tap.git" HEAD:main

      - name: Warn that the tap was not bumped
        if: env.HAS_TAP_TOKEN != 'true'
        run: echo "::warning::HOMEBREW_TAP_TOKEN is not set; homebrew-tap was not bumped to $VERSION. Add the secret (README, Release flow) or edit Casks/app-cleaner.rb and Formula/app-cleaner-cli.rb by hand."
